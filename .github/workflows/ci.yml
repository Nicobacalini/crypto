name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Compilación, Lints y Tests
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache de dependencias Cargo
        uses: Swatinem/rust-cache@v2

      - name: 1. Verificación de Formato (rustfmt)
        run: cargo fmt --check

      - name: 2. Linter Estricto (Clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: 3. Suite de Tests Unitarios y de Integración
        run: |
          cargo test --all-targets
          cargo test --doc

      - name: 4. Build de Release con Overflow Checks
        run: cargo build --release